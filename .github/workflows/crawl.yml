name: Crawl News

on:
  # Run every hour Mon-Fri 06:00–20:00 UTC (= 08:00–22:00 SAST)
  # The actual fire time is controlled by 'scheduleHour' stored in Firestore.
  # crawl.js compares current SAST hour against scheduleHour and exits early
  # when it is not the right time, so only one run per day does real work.
  schedule:
    - cron: '0 6-20 * * 1-5'

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      hours_back:
        description: '수집 기간 (시간, 기본값: Firestore 설정 사용)'
        required: false
        default: ''

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --prefer-offline
        working-directory: scripts

      - name: Run crawler
        run: node crawl.js ${{ github.event.inputs.hours_back }}
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
