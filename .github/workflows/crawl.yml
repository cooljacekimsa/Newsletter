name: Crawl News

on:
  # Manual trigger only — triggered from the app via GitHub API (workflow_dispatch)
  workflow_dispatch:
    inputs:
      hours_back:
        description: '수집 기간 (시간)'
        required: false
        default: ''

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: scripts/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('scripts/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install --prefer-offline
        working-directory: scripts

      - name: Run crawler
        run: node crawl.js ${{ github.event.inputs.hours_back }}
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
