name: Deploy to Firebase

on:
  push:
    branches:
      - claude/firebase-web-app-impl-4ail8j

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/firebase-web-app-impl-4ail8j

      - name: Deploy to Firebase Hosting
        run: |
          echo "$FIREBASE_SA" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          set +e
          out=$(npx firebase-tools@latest deploy \
            --only hosting \
            --project newslettersa-d21db \
            --non-interactive 2>&1)
          code=$?
          echo "$out"
          rm -f /tmp/sa.json
          if [ $code -ne 0 ] && echo "$out" | grep -q "is the current active version"; then
            echo "::notice::Content already live for this version — treating redundant release error as success."
            exit 0
          fi
          exit $code
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
